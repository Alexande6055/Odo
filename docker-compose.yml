services:

  db:
    image: postgres:15
    container_name: odoo16-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo16-db-data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped

  web:
    image: odoo:16.0
    container_name: odoo16
    depends_on:
      - db
    ports:
      - "8069:8069"
    env_file:
      - .env
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo16-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo/config
      - ./.env:/etc/odoo/.env:ro
    networks:
      - default
      - traccar_net
    restart: unless-stopped

networks:
  default:
  traccar_net:
    external: true
    name: tracar_odoo_default

volumes:
  odoo16-db-data:
  odoo16-web-data:
