services:
  db:
    image: postgres:15-alpine
    container_name: traccar-db
    restart: always
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: traccar_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  traccar:
    image: traccar/traccar:latest
    container_name: traccar
    hostname: traccar
    restart: always
    depends_on:
      - db
    ports:
      - "8082:8082"
      - "5000-5036:5000-5036"
      - "5038-5150:5038-5150"
      - "5000-5036:5000-5036/udp"
      - "5038-5150:5038-5150/udp"

    volumes:
      - ./traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - ./logs:/opt/traccar/logs

  map-bridge:
    build: ./microsistema-ruta-vehiculo
    container_name: traccar-map-bridge
    restart: always
    depends_on:
      - traccar
    ports:
      - "3050:3000"
    environment:
      - PORT=3000
      - TRACCAR_URL=http://traccar:8082

volumes:
  postgres_data:
